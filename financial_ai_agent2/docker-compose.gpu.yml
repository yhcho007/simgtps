version: "3.8"
services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile.gpu
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 24G
    volumes:
      - ./agent:/app
      - ./models:/app/models
    ports:
      - "8000:8000"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    volumes:
      - ./gateway:/app
      - ./frontend:/app/frontend
    ports:
      - "3000:3000"
    depends_on:
      - agent

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3001:3000"
